name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: C++20 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Eigen on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libeigen3-dev libegl1
      - name: Install Eigen on macOS
        if: runner.os == 'macOS'
        run: brew list eigen >/dev/null 2>&1 || brew install eigen
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Run mathematical and CLI tests
        run: ctest --test-dir build --output-on-failure --timeout 60
      - name: Select supported viewer Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Prepare native viewer tests
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r desktop/requirements.txt -r analysis/requirements.txt
          .venv/bin/python -c "import PySide6.QtWidgets; import matplotlib.backends.backend_qtagg; import desktop.growth_viewer"
      - name: Test viewer data and synchronized states
        env:
          QT_QPA_PLATFORM: offscreen
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
